# # -----------------------------------------------------------
# # SWAY POP-UP & DIALOG RULES
# # -----------------------------------------------------------
#
# # Catch standard X11/XWayland window types (ICCMM / EWMH standards)
# for_window [window_type="dialog"] floating enable
# for_window [window_type="menu"] floating enable
# for_window [window_type="dropdown_menu"] floating enable
# for_window [window_type="popup_menu"] floating enable
# for_window [window_type="tooltip"] floating enable
# for_window [window_type="utility"] floating enable
#
# # Catch common application window roles (Browsers, GTK/Qt apps)
# for_window [window_role="pop-up"] floating enable
# for_window [window_role="bubble"] floating enable
# for_window [window_role="task_dialog"] floating enable
# for_window [window_role="Preferences"] floating enable
# for_window [window_role="About"] floating enable
# for_window [window_role="page-info"] floating enable
# for_window [window_role="Open Files"] floating enable
# for_window [window_role="File Operation Progress"] floating enable
# for_window [window_role="Save As"] floating enable
#
# # Fallback: Catch windows by common titles (case-insensitive regex)
# for_window [title="(?i)preferences"] floating enable
# for_window [title="(?i)settings"] floating enable
# for_window [title="(?i)copying"] floating enable
# for_window [title="(?i)deleting"] floating enable
# for_window [title="(?i)moving"] floating enable
# for_window [title="(?i)about"] floating enable
# for_window [title="(?i)save file"] floating enable
# for_window [title="(?i)open file"] floating enable
#
# # Explicit rules for common system pop-ups, authenticators, and pickers
# for_window [app_id="xdg-desktop-portal-gtk"] floating enable
# for_window [app_id="polkit-gnome-authentication-agent-1"] floating enable
# for_window [app_id="polkit-kde-authentication-agent-1"] floating enable
# for_window [app_id="lxqt-policykit-agent"] floating enable
# for_window [app_id="nm-connection-editor"] floating enable
# for_window [app_id="pavucontrol"] floating enable
# for_window [app_id="blueman-manager"] floating enable
# for_window [app_id="nwg-look"] floating enable
# for_window [app_id="wdisplays"] floating enable
#
# # Optional: Add boundaries/rules for purely floating popups
# # (e.g. keeping them centered or assigning a border)
# for_window [window_type="dialog"] border pixel 1, move position center
#
# # per spirale
# for_window [class=".*"] split toggle
# default_orientation vertical
#
# floating_minimum_size 500 x 300

#Suse:
# Wayland default floats
for_window [app_id="(Calendar|Calculator|Power-statistics|Control-center)"] floating enable
for_window [app_id="org.gnome.(Nautilus|Weather)"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="(pavucontrol|psensor)"] floating enable
for_window [app_id="evolution-alarm-notify"] floating enable
for_window [app_id="nemo"] floating enable
for_window [app_id="evolution" title="Compose Message"] floating enable
for_window [app_id="evolution" title="Re(.*)"] floating enable
for_window [app_id="evolution" title="Fwd(.*)"] floating enable
for_window [app_id="mpv"] floating enable
for_window [app_id="mpv"] resize set 960 540
for_window [app_id="mpv"] border pixel 0
for_window [app_id="firefox" title="Pushbullet"] floating enable
for_window [app_id="firefox" title="Firefox — Sharing Indicator"] floating enable, sticky enable
for_window [app_id="firefox" title="Picture-in-Picture"] floating enable, sticky enable
for_window [app_id="firefox" title="Pushbullet – Mozilla Firefox"] floating enable
for_window [app_id="firefox" title="About Mozilla Firefox"] floating enable

# Brave, chrome, chromium
for_window [title="(?i)picture-in-picture"] floating enable, sticky enable

# Inhibit idle (prevent screen locking and monitor sleep) when any window is in fullscreen
for_window [class=".*"] inhibit_idle fullscreen
for_window [app_id=".*"] inhibit_idle fullscreen

