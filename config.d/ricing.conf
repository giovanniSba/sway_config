# Gruvbox Light Palette
set $bg      #fbf1c7
set $fg      #3c3836
set $gray    #928374
set $red     #cc241d
set $yellow  #d79921
set $blue    #458588
set $orange	 #d65d0e
# Window borders
# class                 border  bground text    indicator child_border
client.focused          $orange   $orange   $bg     $yellow   $orange
client.focused_inactive $gray   $gray   $bg     $gray     $gray
client.unfocused        $gray   $bg     $fg     $gray     $gray
client.urgent           $red    $red    $bg     $red      $red

default_border pixel 3
gaps inner 5
