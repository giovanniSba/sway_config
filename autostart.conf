# init dbus
exec dbus-update-activation-environment --all

# audio
# exec sh $HOME/scripts/audio_stack.sh
# other
exec waybar --config ~/.config/sway/waybar/config --style ~/.config/sway/waybar/style.css
exec dunst
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec ~/.config/sway/bin/polkit-agent.sh
exec killall xdg-desktop-portal-kde

exec_always ~/.config/sway/bin/portal-init.sh

