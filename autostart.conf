# init dbus and import Wayland/Java environment variables
exec sh -c "export _JAVA_AWT_WM_NONREPARENTING=1 MOZ_ENABLE_WAYLAND=1 QT_QPA_PLATFORM='wayland;xcb' SDL_VIDEODRIVER=wayland CLUTTER_BACKEND=wayland NO_AT_BRIDGE=1 XDG_CURRENT_DESKTOP=sway; dbus-update-activation-environment --all"

# Set global dark theme preference for GTK4, Libadwaita, Browsers and Flatpaks
exec_always gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# audio
# exec sh $HOME/scripts/audio_stack.sh
# other
exec waybar --config ~/.config/sway/waybar/config --style ~/.config/sway/waybar/style.css
exec dunst
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec ~/.config/sway/bin/polkit-agent.sh
exec killall xdg-desktop-portal-kde

exec_always ~/.config/sway/bin/portal-init.sh

# wallpaper
output "*" bg ~/.config/sway/wallpaper/houseonthesideofalake.jpg fill

